name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись: личный ключ из секретов"
          else
            echo "::warning::Секрет SIGNING_KEYSTORE_BASE64 не задан — APK подписан отладочным ключом. Обновление поверх прошлой версии может не установиться."
          fi

      - name: Unit tests (core)
        run: gradle --no-daemon :core:test

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Check — no INTERNET permission
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::В APK попало разрешение INTERNET"; exit 1
          fi
          mkdir -p dist && cp "$APK" dist/PdfReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PdfReader-apk
          path: dist/PdfReader.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: core/build/reports/tests/

      - name: Publish "latest" release (download from phone)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Последняя сборка' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/PdfReader.apk
          body: "Сборка из коммита ${{ github.sha }}. Скачайте PdfReader.apk на телефон и установите."
